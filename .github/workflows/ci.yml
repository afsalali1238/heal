name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The app lives in anatomy-explorer/, not at the repo root — every step
# runs there. (The old workflow ran at the root, where there is no
# package.json, so setup-node's npm cache lookup failed before anything
# else could run. It also pinned Node 20 while the app requires >= 22,
# called a `lint` script that does not exist, and ran `sync:content`,
# which pulls the live sheet and rewrites content files — a manual
# operation, not a PR check.)
defaults:
  run:
    working-directory: anatomy-explorer

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The lockfile commit-back step pushes a regenerated package-lock.json
    # to the PR branch when npm ci reports drift.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: anatomy-explorer/package-lock.json

    - name: Install dependencies
      # Strict `npm ci` first. If the lockfile has drifted from package.json
      # again (transitive-range drift that no static check catches — seen
      # 2026-09-04), fall back to `npm install`, which re-resolves, and let
      # the commit-back step below commit the regenerated lockfile. The next
      # run is strict again. Never silently accept a red install.
      run: |
        node --version
        npm --version
        pwd
        ls
        if npm ci --loglevel verbose > "$RUNNER_TEMP/npm-install.log" 2>&1; then
          echo "strict install clean"
        else
          tail -n 30 "$RUNNER_TEMP/npm-install.log"
          echo "npm ci reported drift — re-resolving with npm install"
          npm install > "$RUNNER_TEMP/npm-regen.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/npm-regen.log"; exit 1; }
        fi

    - name: Upload install log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-install-log
        path: ${{ runner.temp }}/npm-install.log
        retention-days: 3

    - name: Commit regenerated lockfile
      # Best-effort bookkeeping: only runs when gates+build already passed,
      # and never fails the run (branch protection may refuse the push —
      # then a human commits the lockfile by hand).
      if: success()
      run: |
        if [ -n "$(git status --porcelain -- anatomy-explorer/package-lock.json)" ]; then
          git config user.name "arena-ci[bot]"
          git config user.email "arena-ci[bot]@users.noreply.github.com"
          git add anatomy-explorer/package-lock.json
          git commit -m "chore: regenerate package-lock.json (healthy-runner npm install)"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}" || echo "lockfile push refused — commit it by hand"
        else
          echo "lockfile unchanged"
        fi

    - name: Typecheck
      run: npm run typecheck

    - name: Content and asset gates
      run: npm run check:all

    - name: Build
      run: npm run build
