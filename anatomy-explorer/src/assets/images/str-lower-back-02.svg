  <title id="fig-title-str-lowerback-02">Lumbar Rotation — movement figure</title>
  <desc>Schematic movement figure. Let both knees fall slowly to one side.  The range is whatever the words describe, not what this drawing shows.</desc>
  <style>
    .mv { will-change: transform; }
    @keyframes mv-legL {
      0% { transform: rotate(0deg); }
      38.5% { transform: rotate(-38deg); }
      55.4% { transform: rotate(-38deg); }
      93.8% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-legR {
      0% { transform: rotate(0deg); }
      38.5% { transform: rotate(-38deg); }
      55.4% { transform: rotate(-38deg); }
      93.8% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
