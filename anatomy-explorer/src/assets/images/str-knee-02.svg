    <text x="22" y="50" font-size="13" fill="#6B7280">Schematic drawn from the words below — not a photograph</text>
    <text x="22" y="491" font-size="14" fill="#4B5563">Lean forward slightly until you feel a stretch</text>
    <text x="22" y="506" font-size="14" fill="#4B5563">in the back of your straight leg.</text>
