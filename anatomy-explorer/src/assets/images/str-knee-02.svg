  <title id="fig-title-str-knee-02">Seated Hamstring Stretch — movement figure</title>
  <desc>Schematic movement figure. Lean forward slightly until you feel a stretch in the back of your straight leg.  The range is whatever the words describe, not what this drawing shows.</desc>
