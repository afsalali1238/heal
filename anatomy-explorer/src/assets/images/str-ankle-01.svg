  <title id="fig-title-str-ankle-01">Calf Stretch against Wall — movement figure</title>
  <desc>Schematic movement figure. Lean forward and bend your front knee until you feel a stretch in your back calf.  The range is whatever the words describe, not what this drawing shows.</desc>
