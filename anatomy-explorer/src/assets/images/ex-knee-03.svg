<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560" role="img" aria-labelledby="fig-title-ex-knee-03">
  <title id="fig-title-ex-knee-03">Wall Slide — movement figure</title>
  <desc>Schematic movement figure. Slowly slide down the wall until your knees are bent to a 45-degree angle.  The range is whatever the words describe, not what this drawing shows.</desc>
  <style>
    .mv { will-change: transform; }
    @keyframes mv-legL {
      0% { transform: rotate(0deg); }
      13.2% { transform: rotate(-46deg); }
      18% { transform: rotate(-46deg); }
      36% { transform: rotate(-46deg); }
      54% { transform: rotate(-46deg); }
      69.3% { transform: rotate(-46deg); }
      82.5% { transform: rotate(0deg); }
      84.7% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-legR {
      0% { transform: rotate(0deg); }
      13.2% { transform: rotate(-46deg); }
      18% { transform: rotate(-46deg); }
      36% { transform: rotate(-46deg); }
      54% { transform: rotate(-46deg); }
      69.3% { transform: rotate(-46deg); }
      82.5% { transform: rotate(0deg); }
      84.7% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-shinL {
      0% { transform: rotate(0deg); }
      18% { transform: rotate(0deg); }
      31.2% { transform: rotate(46deg); }
      36% { transform: rotate(46deg); }
      54% { transform: rotate(46deg); }
      69.3% { transform: rotate(46deg); }
      84.7% { transform: rotate(46deg); }
      97.9% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-shinR {
      0% { transform: rotate(0deg); }
      18% { transform: rotate(0deg); }
      31.2% { transform: rotate(46deg); }
      36% { transform: rotate(46deg); }
      54% { transform: rotate(46deg); }
      69.3% { transform: rotate(46deg); }
      84.7% { transform: rotate(46deg); }
      97.9% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-torso {
      0% { transform: rotate(0deg); }
      18% { transform: rotate(0deg); }
      36% { transform: rotate(0deg); }
      49.2% { transform: translate(0px, 34px) rotate(0deg); }
      54% { transform: translate(0px, 34px) rotate(0deg); }
      67.2% { transform: rotate(0deg); }
      69.3% { transform: rotate(0deg); }
      84.7% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
