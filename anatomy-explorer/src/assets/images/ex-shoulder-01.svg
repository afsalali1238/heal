  <title id="fig-title-ex-shoulder-01">Shoulder Rolls — movement figure</title>
  <desc>Schematic movement figure. Roll your shoulders up, back, and down in a smooth circular motion.  The range is whatever the words describe, not what this drawing shows.</desc>
  <style>
    .mv { will-change: transform; }
    @keyframes mv-armL {
      0% { transform: rotate(0deg); }
      30.3% { transform: rotate(-16deg); }
      33.3% { transform: rotate(-16deg); }
      63.6% { transform: rotate(14deg); }
      66.7% { transform: rotate(14deg); }
      97% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-armR {
      0% { transform: rotate(0deg); }
      30.3% { transform: rotate(-16deg); }
      33.3% { transform: rotate(-16deg); }
      63.6% { transform: rotate(14deg); }
      66.7% { transform: rotate(14deg); }
      97% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
