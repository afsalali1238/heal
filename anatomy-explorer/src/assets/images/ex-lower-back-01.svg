  <title id="fig-title-ex-lowerback-01">Pelvic Tilt — movement figure</title>
  <desc>Schematic movement figure. Flatten your lower back against the floor by tightening your stomach muscles. The space under the lower back closes; nothing in the limbs moves. The range is whatever the words describe, not what this drawing shows.</desc>
  <style>
    .mv { will-change: transform; }
    @keyframes mv-torso {
      0% { transform: rotate(0deg); }
      66.7% { transform: rotate(-7deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
