  <title id="fig-title-ex-hip-01">Side-Lying Hip Abduction — movement figure</title>
  <desc>Schematic movement figure. Slowly lift your top leg straight up toward the ceiling.  The range is whatever the words describe, not what this drawing shows.</desc>
