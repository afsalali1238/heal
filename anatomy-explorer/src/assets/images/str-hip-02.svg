  <title id="fig-title-str-hip-02">Standing Hip Flexor Stretch — movement figure</title>
  <desc>Schematic movement figure. Bend your front knee slightly and tuck your pelvis under until you feel a stretch in the front of your back hip.  The range is whatever the words describe, not what this drawing shows.</desc>
  <style>
    .mv { will-change: transform; }
    @keyframes mv-legR {
      0% { transform: rotate(0deg); }
      20.2% { transform: rotate(12deg); }
      25% { transform: rotate(12deg); }
      54% { transform: rotate(12deg); }
      77% { transform: rotate(12deg); }
      97.2% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-torso {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(0deg); }
      45.2% { transform: rotate(8deg); }
      54% { transform: rotate(8deg); }
      74.2% { transform: rotate(0deg); }
      77% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
