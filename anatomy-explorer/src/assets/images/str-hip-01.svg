  <title id="fig-title-str-hip-01">Figure-4 Stretch — movement figure</title>
  <desc>Schematic movement figure. Cross one ankle over the opposite knee and gently pull the bottom leg towards your chest.  The range is whatever the words describe, not what this drawing shows.</desc>
