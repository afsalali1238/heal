      53.7% { transform: rotate(-44deg); }
      76.8% { transform: rotate(-44deg); }
      97.2% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-legL {
      0% { transform: rotate(0deg); }
      24.4% { transform: rotate(0deg); }
      44.7% { transform: rotate(-64deg); }
      53.7% { transform: rotate(-64deg); }
      74% { transform: rotate(0deg); }
      76.8% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
