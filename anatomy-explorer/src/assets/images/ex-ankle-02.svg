  <title id="fig-title-ex-ankle-02">Heel Raises — movement figure</title>
  <desc>Schematic movement figure. Slowly lift both heels off the floor to stand on your toes.  The range is whatever the words describe, not what this drawing shows.</desc>
  <style>
    .mv { will-change: transform; }
    @keyframes mv-footL {
      0% { transform: rotate(0deg); }
      41% { transform: rotate(-30deg); }
      53.3% { transform: rotate(-30deg); }
      94.3% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-footR {
      0% { transform: rotate(0deg); }
      41% { transform: rotate(-30deg); }
      53.3% { transform: rotate(-30deg); }
      94.3% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
