  <title id="fig-title-ex-lowerback-02">Bird Dog — movement figure</title>
  <desc>Schematic movement figure. Straighten one arm forward and the opposite leg backward.  The range is whatever the words describe, not what this drawing shows.</desc>
  <style>
    .mv { will-change: transform; }
    @keyframes mv-armL {
      0% { transform: rotate(0deg); }
      13.6% { transform: rotate(90deg); }
      18.2% { transform: rotate(90deg); }
      36.3% { transform: rotate(90deg); }
      54.5% { transform: rotate(90deg); }
      68% { transform: rotate(0deg); }
      69.6% { transform: rotate(0deg); }
      84.8% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-legR {
      0% { transform: rotate(0deg); }
      18.2% { transform: rotate(0deg); }
      31.7% { transform: rotate(-90deg); }
      36.3% { transform: rotate(-90deg); }
      54.5% { transform: rotate(-90deg); }
      69.6% { transform: rotate(-90deg); }
      83.2% { transform: rotate(0deg); }
      84.8% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes mv-shinR {
      0% { transform: rotate(0deg); }
      18.2% { transform: rotate(0deg); }
      36.3% { transform: rotate(0deg); }
      49.9% { transform: rotate(90deg); }
      54.5% { transform: rotate(90deg); }
      69.6% { transform: rotate(90deg); }
      84.8% { transform: rotate(90deg); }
      98.4% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    /* Reduced motion and print both fall back to the two states, which say the same
       thing without moving: the faded body is where it starts, the solid outline and
       the arc are where it ends. */
    @media (prefers-reduced-motion: reduce), print {
      .live { display: none; }
      .end { opacity: 1 !important; }
    }
  </style>
