  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="22" y="30" font-size="19" font-weight="600" fill="#111827">Bird Dog</text>
    <text x="22" y="50" font-size="13" fill="#6B7280">Schematic drawn from the words below — not a photograph</text>
    <text x="22" y="491" font-size="14" fill="#4B5563">Straighten one arm forward and the opposite leg</text>
    <text x="22" y="506" font-size="14" fill="#4B5563">backward.</text>
    <text x="22" y="521" font-size="12" fill="#6B7280">Range: as far as the words say. The picture shows which</text>
